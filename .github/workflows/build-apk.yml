name: Build SAMSSZ Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract SAMSSZ project ZIP
        shell: bash
        run: |
          set -e

          echo "Mencari ZIP project SAMSSZ..."

          ZIP_FILE=""

          while IFS= read -r file; do
            if unzip -l "$file" | grep -q "settings.gradle"; then
              ZIP_FILE="$file"
              break
            fi
          done < <(find . -maxdepth 1 -type f -iname "*.zip")

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project yang berisi settings.gradle tidak ditemukan."
            echo "Isi repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP yang digunakan: $ZIP_FILE"

          rm -rf _samssz_project
          mkdir -p _samssz_project

          unzip -q "$ZIP_FILE" -d _samssz_project

          SETTINGS="$(find _samssz_project -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan setelah extract."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project Android ditemukan:"
          echo "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK and capture error
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "========================================"
          echo "SAMSSZ MOBILE APK BUILD"
          echo "========================================"
          echo "Project: $PROJECT_DIR"
          echo ""

          set +e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          echo ""
          echo "========== ERROR SUMMARY =========="

          grep -nEi \
            "error:|error |FAILURE:|What went wrong|Execution failed|Caused by:|Could not|Exception|AAPT|Manifest merger failed|Compilation failed" \
            "$GITHUB_WORKSPACE/build.log" \
            | tail -100 || true

          echo ""
          echo "========== LAST 150 LOG LINES =========="

          tail -150 "$GITHUB_WORKSPACE/build.log"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "BUILD GAGAL"
            echo "========================================"
            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "========================================"
          echo "BUILD BERHASIL"
          echo "========================================"

      - name: Show APK information
        if: success()
        shell: bash
        run: |
          echo "APK yang dibuat:"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAMSSZ-Mobile-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAMSSZ-Mobile-build-log
          path: build.log
          if-no-files-found: warn
